<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rewriter — Re-author Your Story</title>
		<style>
			body {
				background-color: #f5f5f5;
				margin-top: 8%;
				color: #5d5d5d;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
					"Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
					"Noto Color Emoji";
				text-shadow: 0px 1px 1px rgba(255, 255, 255, 0.75);
				text-align: center;
			}

			h1 {
				font-size: 2.45em;
				font-weight: 700;
				color: #5d5d5d;
				letter-spacing: -0.02em;
				margin-bottom: 30px;
				margin-top: 30px;
			}

			.container {
				width: 100%;
				margin-right: auto;
				margin-left: auto;
			}

			.animate__animated {
				animation-duration: 1s;
				animation-fill-mode: both;
			}

			.animate__fadeIn {
				animation-name: fadeIn;
			}

			.info {
				color: #5594cf;
				fill: #5594cf;
			}

			.error {
				color: #c92127;
				fill: #c92127;
			}

			.warning {
				color: #ffcc33;
				fill: #ffcc33;
			}

			.success {
				color: #5aba47;
				fill: #5aba47;
			}

			.icon-large {
				height: 132px;
				width: 132px;
			}

			.description-text {
				color: #707070;
				letter-spacing: -0.01em;
				font-size: 1.25em;
				line-height: 20px;
			}

			.footer {
				margin-top: 40px;
				font-size: 0.7em;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="row">
				<div class="col">
					<div class="animate__animated animate__fadeIn">
						<svg
							aria-hidden="true"
							focusable="false"
							class="warning icon-large fa-hard-hat"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 512 512"
						>
							<path
								d="M480 288c0-80.25-49.28-148.92-119.19-177.62L320 192V80a16 16 0 0 0-16-16h-96a16 16 0 0 0-16 16v112l-40.81-81.62C81.28 139.08 32 207.75 32 288v64h448zm16 96H16a16 16 0 0 0-16 16v32a16 16 0 0 0 16 16h480a16 16 0 0 0 16-16v-32a16 16 0 0 0-16-16z"
							></path>
						</svg>
					</div>
					<h1 class="animate__animated animate__fadeIn">What is Rewriter and how does it work?</h1>
					<div class="description-text animate__animated animate__fadeIn">
						<p>Is Rewriter really free to use?</p>
						<p>How does Rewriter protect my privacy?</p>
						<section class="footer"><strong>Domain:</strong> rewriter.lyfmail.com</section>
					</div>
				</div>
			</div>
		</div>
	</body>
	<footer class="folio-footer" id="folio-footer">
    <a href="https://lyfmail.com" class="folio-brand" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 80 120" fill="none" aria-hidden="true">
        <path d="M40 2 C60 2 74 22 71 52 C68 72 54 83 40 112 C26 83 12 72 9 52 C6 22 20 2 40 2Z" fill="currentColor" opacity="0.3"/>
        <path d="M40 2 L40 112" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
      </svg>
      Made by LYF Mail
    </a>
    <div class="folio-links">
      <span class="folio-label">Email Contact:</span>
      <a href="mailto:rewriter@lyfmail.com">rewriter@lyfmail.com</a>
    </div>
    <button class="folio-crisis-link" id="footer-crisis" type="button" aria-label="Crisis Resources">
      <span aria-hidden="true">🌿</span> Crisis Resources
    </button>
  </footer>
</html>
